<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TiinyComics</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="comics.css">
</head>
<body>
  <div id="ambient" class="ambient" aria-hidden="true"></div>

  <header class="topbar glass">
   <div class="topbar-side">
    <h1>TiinyComics</h1>
    <div class="device">
      <button id="deviceBtn" type="button" class="btn" aria-expanded="false" aria-controls="devicePanel" disabled>
        <span id="connDot" class="dot" aria-hidden="true"></span>
        <span class="icon-slot" data-icon="cpu"></span>
        <span id="connText"></span>
        <span class="icon-slot small" data-icon="chevron-down"></span>
      </button>
      <div id="devicePanel" class="device-panel" hidden>
        <p class="panel-title" data-i18n="models"></p>
        <div id="modelList" class="model-list"></div>
        <p class="hint" data-i18n="modelsHint"></p>
      </div>
    </div>
    <div class="meter">
      <span class="meter-label">NPU</span>
      <span class="meter-track"><span id="npuBar" class="meter-fill"></span></span>
      <span id="npuText" class="meter-value">–</span>
    </div>
    <div class="meter">
      <span class="meter-label" data-i18n="memory"></span>
      <span class="meter-track"><span id="memBar" class="meter-fill"></span></span>
      <span id="memText" class="meter-value">–</span>
    </div>
   </div>
   <div class="topbar-center">
    <div class="project-box">
      <input id="projectTitle" class="field title-field" type="text" spellcheck="false" data-i18n-placeholder="untitled" data-i18n-aria="projectTitle">
      <button id="projectBtn" type="button" class="btn" data-icon="folder-open" data-i18n="projects" aria-expanded="false"></button>
      <div id="projectMenu" class="menu" hidden></div>
    </div>
    <div class="project-box">
      <button id="exportBtn" type="button" class="btn" data-icon="file-down" data-i18n="export" aria-expanded="false"></button>
      <div id="exportMenu" class="menu" hidden></div>
    </div>
   </div>
   <div class="topbar-side end">
    <label class="btn language">
      <span class="icon-slot" data-icon="languages"></span>
      <select id="language" data-i18n-aria="language"></select>
    </label>
    <button id="connBtn" type="button" class="btn"></button>
   </div>
  </header>

  <!-- Gauche : bibliothèque, puis style et histoire ; deux blocs repliables -->
  <div class="side side-left">
    <div class="side-inline"></div>
    <section id="libraryPanel" class="panel glass context block">
      <div class="context-head block-head">
        <h2><span class="icon-slot small" data-icon="images"></span><span data-i18n="library"></span></h2>
        <span class="section-actions">
          <span id="libraryCount" class="muted"></span>
          <button type="button" class="btn icon-btn collapse-btn" data-collapse="libraryPanel" aria-expanded="true"></button>
        </span>
      </div>
      <div class="block-body">
        <p class="hint" data-i18n="libraryHint"></p>
        <button id="uploadBtn" type="button" class="btn dashed" data-icon="upload" data-i18n="loadImages"></button>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
        <div id="library" class="gallery"></div>
      </div>
    </section>

    <section id="storyPanel" class="panel glass block">
      <div class="context-head block-head">
        <h2><span class="icon-slot small" data-icon="book"></span><span data-i18n="story"></span></h2>
        <span class="section-actions">
          <button type="button" class="btn icon-btn collapse-btn" data-collapse="storyPanel" aria-expanded="true"></button>
        </span>
      </div>
      <div class="block-body">
        <label class="stack"><span data-i18n="styleLabel"></span>
          <textarea id="projectStyle" class="field" rows="3" data-i18n-placeholder="stylePlaceholder"></textarea></label>
        <label class="stack"><span data-i18n="synopsisLabel"></span>
          <textarea id="synopsis" class="field" rows="5" data-i18n-placeholder="synopsisPlaceholder"></textarea></label>
      </div>
    </section>
  </div>

  <!-- Centre : la page défile avec le document -->
  <section id="stage" class="stage">
    <div class="page-bar-wrap">
    <div class="page-bar glass">
      <label class="opt" data-i18n-title="formatLabel">
        <span class="icon-slot small" data-icon="book-open"></span>
        <select id="format" class="field compact" data-i18n-aria="formatLabel">
          <option value="bd" data-i18n="formatBd"></option>
          <option value="comics" data-i18n="formatComics"></option>
          <option value="manga" data-i18n="formatManga"></option>
          <option value="webtoon" data-i18n="formatWebtoon"></option>
        </select>
      </label>
      <span class="bar-sep"></span>
      <div id="modes" class="tools" role="toolbar">
        <button type="button" data-mode="layout" data-icon="mouse-pointer-2" data-i18n="modeLayout" data-i18n-title="modeLayout"></button>
        <button type="button" data-mode="frame" data-icon="move" data-i18n="modeFrame" data-i18n-title="modeFrame"></button>
        <button type="button" data-mode="sketch" data-icon="pen-line" data-i18n="modeSketch" data-i18n-title="modeSketch"></button>
        <button type="button" data-mode="retouch" data-icon="wand-sparkles" data-i18n="modeRetouch" data-i18n-title="modeRetouch"></button>
      </div>
      <span class="bar-sep keep"></span>
      <span id="layoutTools" class="bar-group">
      <button id="splitColsBtn" type="button" class="btn icon-btn" data-icon="columns-2" data-i18n-title="splitCols" data-i18n-aria="splitCols"></button>
      <button id="splitRowsBtn" type="button" class="btn icon-btn" data-icon="rows-2" data-i18n-title="splitRows" data-i18n-aria="splitRows"></button>
      <button id="mergePanelBtn" type="button" class="btn icon-btn" data-icon="link" data-i18n-title="mergePanel" data-i18n-aria="mergePanel"></button>
      <button id="regroupBtn" type="button" class="btn icon-btn" data-icon="square-split-vertical" data-i18n-title="regroup" data-i18n-aria="regroup"></button>
      <button id="removePanelBtn" type="button" class="btn icon-btn" data-icon="trash-2" data-i18n-title="removePanel" data-i18n-aria="removePanel"></button>
      <div class="project-box">
        <button id="templateBtn" type="button" class="btn small" data-icon="layout-grid" data-i18n="templates" data-i18n-title="templates" aria-expanded="false"></button>
        <div id="templateMenu" class="menu template-menu" hidden></div>
      </div>
      </span>
      <span id="sketchTools" class="bar-group tools" role="toolbar" hidden>
        <button type="button" data-tool="select" data-icon="mouse-pointer-2" data-i18n-title="toolSelect" data-i18n-aria="toolSelect"></button>
        <button type="button" data-tool="pen" data-icon="pencil" data-i18n-title="toolPen" data-i18n-aria="toolPen"></button>
        <button type="button" data-tool="eraser" data-icon="eraser" data-i18n-title="toolEraser" data-i18n-aria="toolEraser"></button>
        <button type="button" data-tool="character" data-icon="user" data-i18n-title="toolCharacter" data-i18n-aria="toolCharacter"></button>
        <button type="button" data-tool="speech" data-icon="message-circle" data-i18n-title="toolSpeech" data-i18n-aria="toolSpeech"></button>
        <button type="button" data-tool="thought" data-icon="cloud" data-i18n-title="toolThought" data-i18n-aria="toolThought"></button>
        <button type="button" data-tool="caption" data-icon="scroll-text" data-i18n-title="toolCaption" data-i18n-aria="toolCaption"></button>
        <button type="button" data-tool="sfx" data-icon="zap" data-i18n-title="toolSfx" data-i18n-aria="toolSfx"></button>
        <span class="bar-sep keep"></span>
        <button id="sketchUndoBtn" type="button" class="btn icon-btn" data-icon="undo-2" data-i18n-title="sketchUndo" data-i18n-aria="sketchUndo"></button>
        <button id="sketchRedoBtn" type="button" class="btn icon-btn" data-icon="redo-2" data-i18n-title="sketchRedo" data-i18n-aria="sketchRedo"></button>
      </span>
      <!-- Retouche : outils de l'éditeur d'image (repris de TiinyPaint) -->
      <span id="editTools" class="bar-group" hidden>
        <span id="editToolButtons" class="tools" role="toolbar">
          <button type="button" data-tool="mask" data-icon="paintbrush" data-i18n-title="toolMask" data-i18n-aria="toolMask"></button>
          <button type="button" data-tool="erase" data-icon="eraser" data-i18n-title="toolErase" data-i18n-aria="toolErase"></button>
          <button type="button" data-tool="lasso" data-icon="lasso" data-i18n-title="toolLasso" data-i18n-aria="toolLasso"></button>
          <button type="button" data-tool="rect" data-icon="square-dashed" data-i18n-title="toolRect" data-i18n-aria="toolRect"></button>
          <button type="button" data-tool="restore" data-icon="history" data-i18n-title="toolRestore" data-i18n-aria="toolRestore"></button>
          <button type="button" data-tool="stamp" data-icon="stamp" data-i18n-title="toolStamp" data-i18n-aria="toolStamp"></button>
          <button type="button" data-tool="crop" data-icon="crop" data-i18n-title="toolCrop" data-i18n-aria="toolCrop"></button>
        </span>
        <span class="bar-sep keep"></span>
        <button id="undoBtn" type="button" class="btn icon-btn" data-icon="undo-2" data-i18n-title="editUndo" data-i18n-aria="editUndo"></button>
        <button id="redoBtn" type="button" class="btn icon-btn" data-icon="redo-2" data-i18n-title="editRedo" data-i18n-aria="editRedo"></button>
        <button id="zoomResetBtn" type="button" class="btn icon-btn" data-icon="maximize" data-i18n-title="zoomReset" data-i18n-aria="zoomReset"></button>
        <span class="bar-sep keep"></span>
        <button id="retouchSaveBtn" type="button" class="btn icon-btn" data-icon="save" data-i18n-title="retouchSave" data-i18n-aria="retouchSave"></button>
        <button id="retouchGenBtn" type="button" class="btn small primary" data-icon="play" data-i18n="generate"></button>
        <button id="retouchStopBtn" type="button" class="btn small danger" data-icon="square" data-i18n="stop" hidden></button>
        <button id="closeEditorBtn" type="button" class="btn icon-btn" data-icon="x" data-i18n-title="closeRetouch" data-i18n-aria="closeRetouch"></button>
      </span>
      <span class="spacer"></span>
      <label id="stripHeightBox" class="opt" data-i18n-title="stripHeight" hidden><span class="icon-slot small" data-icon="move-vertical"></span><span class="bar-label" data-i18n="stripHeight"></span>
        <input id="stripHeight" class="field num" type="number" min="400" max="20000" step="100"></label>
      <span class="page-nav zoom-box">
        <button id="zoomOutBtn" type="button" class="btn icon-btn" data-icon="zoom-out" data-i18n-title="zoomOut" data-i18n-aria="zoomOut"></button>
        <button id="zoomLabel" type="button" class="btn small zoom-label" data-i18n-title="zoomFit" data-i18n-aria="zoomFit">100 %</button>
        <button id="zoomInBtn" type="button" class="btn icon-btn" data-icon="zoom-in" data-i18n-title="zoomIn" data-i18n-aria="zoomIn"></button>
      </span>
      <span class="bar-sep"></span>
      <span id="pageNav" class="page-nav">
        <button id="prevPageBtn" type="button" class="btn icon-btn" data-icon="chevron-left" data-i18n-title="prevPage" data-i18n-aria="prevPage"></button>
        <span id="pageInfo" class="frame-info"></span>
        <button id="nextPageBtn" type="button" class="btn icon-btn" data-icon="chevron-right" data-i18n-title="nextPage" data-i18n-aria="nextPage"></button>
      </span>
    </div>

    <!-- Retouche : réglages de l'outil actif, sur une ligne sous la barre de page -->
    <div id="editOptions" class="edit-options glass" hidden>
      <label class="opt" data-for="brush" data-i18n-title="brush"><span class="opt-label" data-i18n="brush"></span>
        <input id="brushSize" type="range" min="4" max="500" value="64"><output id="brushValue"></output></label>
      <label class="opt" data-for="mask" data-i18n-title="feather"><span class="opt-label" data-i18n="feather"></span>
        <input id="feather" type="range" min="0" max="80" value="16"><output id="featherValue"></output></label>
      <label class="opt check" data-for="mask" data-i18n-title="showMask"><input id="showMask" type="checkbox" checked><span class="icon-slot small" data-icon="eye"></span><span class="opt-label" data-i18n="showMask"></span></label>
      <button id="invertBtn" type="button" class="btn small" data-for="mask" data-icon="repeat" data-i18n="invert" data-i18n-title="invert"></button>
      <button id="clearMaskBtn" type="button" class="btn small" data-for="mask" data-icon="circle-off" data-i18n="clearMask" data-i18n-title="clearMask"></button>
      <label class="opt" data-for="mask" data-i18n-title="method"><span class="opt-label" data-i18n="method"></span>
        <select id="method" class="field compact">
          <option value="fill" data-i18n="methodFill"></option>
          <option value="keep" data-i18n="methodKeep"></option>
        </select></label>
      <label class="opt" data-for="mask" data-i18n-title="scope"><span class="opt-label" data-i18n="scope"></span>
        <select id="scope" class="field compact">
          <option value="crop" data-i18n="scopeCrop"></option>
          <option value="full" data-i18n="scopeFull"></option>
        </select></label>
      <label class="opt" data-for="restore" data-i18n-title="source"><span class="opt-label" data-i18n="source"></span>
        <select id="source" class="field compact"></select></label>
      <button id="copySourceBtn" type="button" class="btn small" data-for="restore" data-icon="copy" data-i18n="copyFromSource" data-i18n-title="copyFromSource"></button>
      <label class="opt" data-for="crop" data-i18n-title="cropRatio"><span class="opt-label" data-i18n="cropRatio"></span>
        <select id="cropRatio" class="field compact">
          <option value="" data-i18n="cropFree"></option>
          <option value="1:1">1:1</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
          <option value="3:2">3:2</option>
          <option value="2:3">2:3</option>
          <option value="16:9">16:9</option>
          <option value="9:16">9:16</option>
        </select></label>
      <button id="applyCropBtn" type="button" class="btn small" data-for="crop" data-icon="check" data-i18n="applyCrop" data-i18n-title="applyCrop"></button>
      <span class="opt" data-for="crop"><span class="opt-label" data-i18n="editExtend"></span>
        <button type="button" class="btn small" data-extend="left" data-i18n="left" data-i18n-title="editExtendLeft"></button>
        <button type="button" class="btn small" data-extend="right" data-i18n="right" data-i18n-title="editExtendRight"></button>
        <button type="button" class="btn small" data-extend="top" data-i18n="top" data-i18n-title="editExtendTop"></button>
        <button type="button" class="btn small" data-extend="bottom" data-i18n="bottom" data-i18n-title="editExtendBottom"></button></span>
      <button id="rotateBtn" type="button" class="btn small" data-for="crop" data-icon="rotate-cw" data-i18n="rotate" data-i18n-title="rotate"></button>
      <button id="flipBtn" type="button" class="btn small" data-for="crop" data-icon="flip-horizontal" data-i18n="flip" data-i18n-title="flip"></button>
    </div>

    </div>

    <div id="viewport" class="viewport"></div>
    <!-- Retouche : l'image de la case en pleine résolution, avec le zoom de l'éditeur -->
    <div id="retouchView" class="canvas retouch-view" hidden>
      <canvas id="editCanvas" class="edit-canvas"></canvas>
    </div>
    <p id="status" class="status" role="status"></p>
  </section>

  <!-- Droite : pages, puis la case sélectionnée ; deux blocs repliables -->
  <div class="side side-right">
    <div class="side-inline"></div>
    <section id="pagesPanel" class="panel glass block">
      <div class="context-head block-head">
        <h2 data-i18n="pages"></h2>
        <span class="section-actions">
          <span id="pageCount" class="muted"></span>
          <button type="button" class="btn icon-btn collapse-btn" data-collapse="pagesPanel" aria-expanded="true"></button>
        </span>
      </div>
      <div class="block-body">
        <div id="pageList" class="page-list"></div>
        <div class="row">
          <button id="addPageBtn" type="button" class="btn dashed grow-btn" data-icon="file-plus" data-i18n="addPage"></button>
          <button id="removePageBtn" type="button" class="btn icon-btn" data-icon="trash-2" data-i18n-title="removePage" data-i18n-aria="removePage"></button>
        </div>
      </div>
    </section>

      <section id="panelEditor" class="panel glass controls block">
        <div class="section-head block-head">
          <h2 id="panelTitle"></h2>
          <span class="section-actions">
          <button id="prevPanelBtn" type="button" class="btn icon-btn" data-icon="chevron-left" data-i18n-title="prevPanel" data-i18n-aria="prevPanel"></button>
          <button id="nextPanelBtn" type="button" class="btn icon-btn" data-icon="chevron-right" data-i18n-title="nextPanel" data-i18n-aria="nextPanel"></button>
            <button type="button" class="btn icon-btn collapse-btn" data-collapse="panelEditor" aria-expanded="true"></button>
          </span>
        </div>
        <div class="block-body">

      <!-- Retouche : visible seulement dans ce mode -->
      <div class="section" id="retouchSection" hidden>
        <p class="section-title"><span class="icon-slot small" data-icon="paintbrush"></span><span data-i18n="retouchSection"></span></p>
        <label class="stack"><span data-i18n="retouchPromptLabel"></span>
          <textarea id="retouchPrompt" class="field" rows="3" data-i18n-placeholder="retouchPromptPlaceholder"></textarea></label>
        <label class="stack"><span><span class="icon-slot small" data-icon="text-cursor-input"></span> <span data-i18n="retouchTextLabel"></span></span>
          <textarea id="retouchText" class="field" rows="2" data-i18n-placeholder="retouchTextPlaceholder"></textarea></label>
        <p id="retouchHint" class="hint"></p>
      </div>

      <div class="section grow">
        <label class="section-title" for="description"><span class="icon-slot small" data-icon="type"></span><span data-i18n="sceneLabel"></span></label>
        <textarea id="description" class="field" data-i18n-placeholder="scenePlaceholder"></textarea>
      </div>

      <div class="section hide-retouch">
        <div class="section-head">
          <span class="section-title"><span class="icon-slot small" data-icon="wand-sparkles"></span><span data-i18n="finalPrompt"></span></span>
          <span class="section-actions">
            <button id="clearEnhancedBtn" type="button" class="btn icon-btn" data-icon="x" data-i18n-title="clearEnhanced" data-i18n-aria="clearEnhanced" hidden></button>
            <button id="enhanceBtn" type="button" class="btn small" data-icon="sparkles" data-i18n="enhance"></button>
          </span>
        </div>
        <textarea id="enhanced" class="field enhanced" data-i18n-placeholder="enhancedPlaceholder" hidden></textarea>
        <p id="enhanceHint" class="hint" data-i18n="enhanceHint"></p>
        <details id="thinkingBox" hidden>
          <summary id="thinkingSummary"></summary>
          <pre id="thinking" class="scroll-text"></pre>
        </details>
      </div>

      <div class="section">
        <p class="section-title"><span class="icon-slot small" data-icon="image"></span><span data-i18n="panelRefs"></span></p>
        <div id="panelRefs" class="refs"></div>
        <p id="noPanelRefs" class="hint" data-i18n="noPanelRefs"></p>
      </div>

      <div class="section hide-retouch">
        <div class="section-head">
          <span class="section-title"><span class="icon-slot small" data-icon="layers"></span><span data-i18n="contextLabel"></span></span>
          <label class="opt"><span data-i18n="contextImagesCount"></span>
            <input id="contextImages" class="field num tiny" type="number" min="0" max="8" value="2"></label>
        </div>
        <div id="contextStrip" class="refs context-strip"></div>
        <p id="contextHint" class="hint"></p>
      </div>

      <div class="section hide-retouch" id="sketchSection">
        <div class="section-head">
          <span class="section-title"><span class="icon-slot small" data-icon="pen-line"></span><span data-i18n="sketchLabel"></span> <span id="sketchCount" class="muted"></span></span>
          <span class="section-actions">
            <button id="sketchClearBtn" type="button" class="btn icon-btn" data-icon="trash-2" data-i18n-title="sketchClear" data-i18n-aria="sketchClear"></button>
            <button id="sketchDrawBtn" type="button" class="btn small" data-icon="pencil" data-i18n="sketchDraw"></button>
          </span>
        </div>
        <label class="opt check"><input id="sketchUse" type="checkbox" checked> <span data-i18n="sketchUse"></span></label>
        <p id="sketchHint" class="hint"></p>
      </div>

      <div class="section">
        <p class="section-title"><span class="icon-slot small" data-icon="maximize-2"></span><span data-i18n="quality"></span></p>
        <div id="presets" class="pills">
          <button type="button" class="pill" data-preset="draft" data-i18n="presetDraft"></button>
          <button type="button" class="pill" data-preset="mp1">1 MP</button>
          <button type="button" class="pill" data-preset="mp2">2 MP</button>
          <button type="button" class="pill" data-preset="mp4">4 MP</button>
        </div>
        <p id="sizeHint" class="hint"></p>
      </div>

      <div class="seed-row">
        <span class="section-title"><span class="icon-slot small" data-icon="dices"></span><span data-i18n="seed"></span></span>
        <span class="seed-controls">
          <span id="seedAuto" class="muted small-text" data-i18n="seedAuto"></span>
          <input id="seed" class="field seed-input" type="number" min="0" value="42" data-i18n-aria="seed" hidden>
          <button id="seedBtn" type="button" class="btn icon-btn" data-icon="dices"></button>
        </span>
      </div>

      <button id="generateBtn" type="button" class="btn primary" data-icon="play" data-i18n="generate"></button>
      <button id="stopBtn" type="button" class="btn danger" data-icon="square" data-i18n="stop" hidden></button>

      <div class="section">
        <p class="section-title"><span class="icon-slot small" data-icon="scaling"></span><span data-i18n="improve"></span></p>
        <div class="row wrap">
          <span class="muted small-text" data-i18n="upscaleTo"></span>
          <button type="button" class="btn small" data-upscale="mp1">1 MP</button>
          <button type="button" class="btn small" data-upscale="mp2">2 MP</button>
          <button type="button" class="btn small" data-upscale="mp4">4 MP</button>
        </div>
        <div class="row wrap">
          <button id="extendBtn" type="button" class="btn small" data-icon="expand" data-i18n="extend"></button>
          <button id="retouchBtn" type="button" class="btn small" data-icon="paintbrush" data-i18n="retouchImage"></button>
        </div>
        <p id="improveHint" class="hint"></p>
      </div>

      <div class="section">
        <p class="section-title"><span class="icon-slot small" data-icon="history"></span><span data-i18n="versions"></span> <span id="versionCount" class="muted"></span></p>
        <div id="versions" class="versions"></div>
        <p id="noVersions" class="hint" data-i18n="noVersions"></p>
      </div>
        </div>
      </section>
  </div>

  <!-- Chaîne de modèles : LLM et enhancer facultatifs, puis le modèle de diffusion -->
  <section id="chain" class="chain" data-i18n-aria="pipeline">
    <div id="nodeLlm" class="node">
      <div class="node-row">
        <span class="node-tag" data-i18n="llmTag"></span>
        <span class="icon-slot" data-icon="brain"></span>
        <select id="llmModel" class="field" data-i18n-aria="llmLabel"></select>
        <button id="llmToggle" type="button" class="btn icon-btn expand" aria-expanded="false" data-i18n-aria="llmSettings"></button>
      </div>
      <div id="llmBody" class="node-body" hidden>
        <p class="hint" data-i18n="llmHint"></p>
        <label class="line"><span data-i18n="temperature"></span><input id="temperature" class="field num" type="number" min="0" max="2" step="0.05" value="1"></label>
        <label class="line"><span data-i18n="topP"></span><input id="topP" class="field num" type="number" min="0" max="1" step="0.01" value="0.95"></label>
        <label class="line"><span data-i18n="topK"></span><input id="topK" class="field num" type="number" min="1" max="200" value="20"></label>
        <label class="line"><span data-i18n="contextTexts"></span><input id="contextTexts" class="field num" type="number" min="0" max="30" value="6"></label>
      </div>
    </div>
    <div id="nodePe" class="node">
      <div class="node-row">
        <span class="node-tag" data-i18n="peTag"></span>
        <span class="icon-slot" data-icon="sparkles"></span>
        <select id="peModel" class="field" data-i18n-aria="peLabel"></select>
      </div>
    </div>
    <div id="nodeModel" class="node node-model">
      <div class="node-row">
        <span class="node-tag" data-i18n="diffusionTag"></span>
        <span class="icon-slot" data-icon="box"></span>
        <select id="imageModel" class="field" data-i18n-aria="imageModel"></select>
        <div id="genInfo" class="gen-info" role="status" hidden>
          <div class="gen-line"><span id="genTitle" class="gen-title"></span><span id="genPct" class="gen-pct"></span></div>
          <div class="gen-bar"><span id="genBarFill"></span></div>
          <div class="gen-line muted"><span id="genDetail"></span><span id="genTime"></span></div>
        </div>
        <button id="modelToggle" type="button" class="btn icon-btn expand" aria-expanded="false" data-i18n-aria="modelSettings"></button>
      </div>
      <div id="modelBody" class="node-body" hidden>
        <label class="line"><span data-i18n="steps"></span><input id="steps" class="field num" type="number" min="1" max="100" value="40"></label>
        <label class="line"><span data-i18n="draftSteps"></span><input id="draftSteps" class="field num" type="number" min="1" max="100" value="20"></label>
        <label class="line"><span data-i18n="scheduler"></span>
          <select id="scheduler" class="field">
            <option value="" data-i18n="schedulerDefault"></option>
            <option value="euler">euler</option>
            <option value="euler_ancestral_rf">euler_ancestral_rf</option>
            <option value="unipc_flow">unipc_flow</option>
          </select>
        </label>
        <label class="line"><span data-i18n="guidance"></span><input id="guidance" class="field num" type="number" min="0" max="20" step="0.1" value="1"></label>
        <label class="stack"><span data-i18n="negative"></span><input id="negative" class="field" type="text"></label>
        <p class="hint" data-i18n="negativeHint"></p>
        <label class="line"><span data-i18n="previewLabel"></span>
          <select id="previewSteps" class="field">
            <option value="1">50 · 75 · 90 %</option>
            <option value="0" data-i18n="previewOff"></option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <div id="pickerMenu" class="picker-menu" hidden></div>
  <div id="refMenu" class="menu ref-menu" hidden></div>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2 data-i18n="settingsTitle"></h2>
      <div class="dialog-field">
        <label for="baseUrl" data-i18n="address"></label>
        <input id="baseUrl" class="field" type="text" placeholder="http://tiinyhost.local" spellcheck="false" required>
        <p class="hint" data-i18n="addressHint"></p>
      </div>
      <div class="dialog-field">
        <label for="apiKey" data-i18n="apiKey"></label>
        <input id="apiKey" class="field" type="password" autocomplete="off" spellcheck="false" required>
        <p class="hint" data-i18n="apiKeyHint"></p>
      </div>
      <p id="settingsError" class="error" role="alert"></p>
      <div class="row end">
        <button type="button" id="settingsCancel" class="btn" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" value="save" data-i18n="connect"></button>
      </div>
    </form>
  </dialog>

  <input id="projectFileInput" type="file" accept=".tiinycomic,application/json" hidden>

  <script src="prompts.js"></script>
  <script src="i18n.js"></script>
  <script src="i18n-comics.js"></script>
  <script src="icons.js"></script>
  <script src="api.js"></script>
  <script src="project.js"></script>
  <script src="store.js"></script>
  <script src="editor.js"></script>
  <script src="sketch.js"></script>
  <script src="generate.js"></script>
  <script src="export.js"></script>
  <script src="pageview.js"></script>
  <script src="app.js"></script>
</body>
</html>
